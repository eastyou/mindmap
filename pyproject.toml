[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmap"
version = "0.1.0"
description = "把缩进大纲转换成可打印的 SVG 思维导图，零依赖"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["mindmap", "outline", "svg", "education", "visualization", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
mindmap = "mindmap.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/mindmap"
Source = "https://github.com/eastyou/mindmap"

[tool.setuptools]
packages = ["mindmap"]
