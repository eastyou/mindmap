name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test mind map generation
        run: |
          python -m mindmap -i examples/outline.txt -o smoke.html --title 示例思维导图
          python -c "print(open('smoke.html', encoding='utf-8').read().count('<rect'))"
